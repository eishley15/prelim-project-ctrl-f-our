<section class="error-section">
  <div class="error-container">

    <!-- Left Column: Animation -->
    <div class="error-col animation-col" *ngIf="isBrowser">
      <dotlottie-wc
        src="https://lottie.host/7abb3917-c8eb-4298-9de5-02977602ce36/vDa58nK7hl.lottie"
        autoplay
        loop
        class="error-animation">
      </dotlottie-wc>
    </div>

    <!-- Right Column: Text -->
    <div class="error-col text-col">
      <h1 class="error-small-title">PAGE NOT FOUND!</h1>

      <h1 class="error-big-title">Error 404</h1>

      <p class="error-description">
        The page you are looking for was moved, removed, or might never have existed.
      </p>

      <a class="error-btn" href="/">
        Back to homepage
      </a>
    </div>

  </div>
</section>
